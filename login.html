<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - LearnMate AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <header class="topbar">
        <a class="brand" href="index.html">LearnMate AI</a>
    </header>

    <main class="auth-wrap">
        <div class="card form-card auth-card">
            <div class="auth-logo">🎓</div>
            <h1>Welcome back</h1>
            <p class="muted">Sign in to continue learning.</p>

            <!-- Messages (errors) will appear here -->
            <div id="message"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" required placeholder="Your password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <p class="muted">New here? <a href="register.html">Create an account</a></p>
            <p><a href="index.html">← Back to home</a></p>
        </div>
    </main>

    <!-- Load api.js first, then the page script -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
