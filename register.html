<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - LearnMate AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <header class="topbar">
        <a class="brand" href="index.html">LearnMate AI</a>
    </header>

    <main class="auth-wrap">
        <div class="card form-card auth-card">
            <div class="auth-logo">🎓</div>
            <h1>Create your account</h1>
            <p class="muted">Free for students. Takes less than a minute.</p>

            <!-- Messages (errors) will appear here -->
            <div id="message"></div>

<form id="register-form">
  <div class="form-group">
    <label for="name">Name</label>
    <input id="name" type="text" required placeholder="Your full name">
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input id="email" type="email" required placeholder="you@example.com">
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input id="password" type="password" required minlength="6" placeholder="At least 6 characters">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Create account</button>
</form>

            <p class="muted">Already registered? <a href="login.html">Login</a></p>
            <p><a href="index.html">← Back to home</a></p>
        </div>
    </main>

    <!-- Load api.js first, then the page script -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
